name: 问题反馈
description: 输入法异常、崩溃、显示错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前先搜索一下现有 issue，避免重复。
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 例如 Pixel 7 / Android 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 输入法版本
      description: 设置 → 关于 里能看到
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开任意输入框
        2. 切到 Unicode 键盘
        3. 点击 U+ 键
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 日志（崩溃时必填）
      description: adb logcat 里与本应用相关的堆栈
      render: shell
